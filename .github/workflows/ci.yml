name: CI

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build_mc

      - name: Test library
        run: npm run test:ci

      - name: Lint
        run: npm run lint

      - name: Build demo
        run: npm run build_xx

      - name: Test web component in Chrome
        env:
          UI_MATRIX_HEADLESS: '1'
          UI_MATRIX_BROWSER_CHANNEL: chrome
        run: |
          python3 -m http.server 4300 --bind 127.0.0.1 --directory dist/metadata-components-serve &
          trap 'kill "$!"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4300/ --output /dev/null
          node tools/ui-matrix/metadata-ui-matrix.js

      - name: Build and test with metadata-profile 0.11.1
        run: |
          npm install --no-save --no-audit @iqbspecs/metadata-profile@0.11.1
          npm run build_mc
          npm run test:ci
